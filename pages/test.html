    <script>
	


 const scriptURL =
  "https://script.google.com/macros/s/AKfycbw6n1t9gVsjplDxjE-cjMdq926_vOk4FyEQBa81QGLIxDcScjhlXx4zpDgyK6janzY/exec";

const form = document.forms["submit-to-database"];
const submitButton = document.getElementById("submit-button");

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const originalButtonText = submitButton.textContent;
  submitButton.disabled = false;
  submitButton.textContent = "";
  submitButton.classList.add("is-submitting");

  const formData = new FormData(form);

  const exCheckbox = document.getElementById("ex");
  const ageCheckbox = document.getElementById("age");

  if (ageCheckbox) {
    formData.set("age", ageCheckbox.checked ? "Yes" : "No");
  }
  if (exCheckbox) {
    formData.set("ex", exCheckbox.checked ? "Yes" : "No");
  }

  fetch(scriptURL, { method: "POST", body: formData })
    .then((response) => {
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      submitButton.textContent = "";
      swal("");
      form.reset();
    })
    .catch((error) => {
      console.error("Error!", error);
      swal("Error", "SOMETHING WENT WRONG. PLEASE TRY AGAIN!", "error");
    })
    .finally(() => {
      submitButton.disabled = false;
      submitButton.classList.remove("is-submitting");
      submitButton.textContent = originalButtonText;
    });
});

    </script>
