    <script>
	

// Music playing in background on repeat
      

  const music = document.getElementById("bgsong");
  music.play().catch(() => {
    // The browser may block sound-on autoplay until the visitor interacts.
  });

// run on initial load
updateAudio();

// hash changes (back/forward and in-page links)
window.addEventListener('hashchange', updateAudio);
window.addEventListener('popstate', updateAudio);

// if your site code uses history.pushState/replaceState, patch them so updateAudio() runs after any call
(function() {
  const origPush = history.pushState;
  const origReplace = history.replaceState;

  history.pushState = function(...args) {
    const res = origPush.apply(this, args);
    updateAudio();
    return res;
  };

  history.replaceState = function(...args) {
    const res = origReplace.apply(this, args);
    updateAudio();
    return res;
  };
})();

// optional: detect clicks on links/buttons that change view without changing URL hash
document.addEventListener('click', (e) => {
  // adjust selector to match your site's article-close links/buttons
  const el = e.target.closest('a, button');
  if (!el) return;
  // small delay to allow other handlers to update URL/state first
  setTimeout(updateAudio, 50);
});


 const scriptURL =
  "https://script.google.com/macros/s/AKfycbw6n1t9gVsjplDxjE-cjMdq926_vOk4FyEQBa81QGLIxDcScjhlXx4zpDgyK6janzY/exec";

const form = document.forms["submit-to-database"];
const submitButton = document.getElementById("submit-button");

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const originalButtonText = submitButton.textContent;
  submitButton.disabled = false;
  submitButton.textContent = "";
  submitButton.classList.add("is-submitting");

  const formData = new FormData(form);

  const exCheckbox = document.getElementById("ex");
  const ageCheckbox = document.getElementById("age");

  if (ageCheckbox) {
    formData.set("age", ageCheckbox.checked ? "Yes" : "No");
  }
  if (exCheckbox) {
    formData.set("ex", exCheckbox.checked ? "Yes" : "No");
  }

  fetch(scriptURL, { method: "POST", body: formData })
    .then((response) => {
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      submitButton.textContent = "";
      swal("");
      form.reset();
    })
    .catch((error) => {
      console.error("Error!", error);
      swal("Error", "SOMETHING WENT WRONG. PLEASE TRY AGAIN!", "error");
    })
    .finally(() => {
      submitButton.disabled = false;
      submitButton.classList.remove("is-submitting");
      submitButton.textContent = originalButtonText;
    });
});

    </script>
